[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsr-hub"
version = "0.1.0"
description = "GSR acquisition hub for Teensy serial devices"
requires-python = ">=3.11"
dependencies = [
  "pyserial",
  "numpy"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
