[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg_hub"
version = "0.1.0"
description = "ECG acquisition hub for Teensy AD8232 streams"
readme = ""
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
